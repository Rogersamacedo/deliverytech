services:
  api:
    build: .
    container_name: delivery-api
    ports:
      - "8080:8080"
    environment:
      # Chave do JWT: mínimo de 32 caracteres.
      # Para trocar, crie um arquivo .env ao lado deste com JWT_SECRET=sua-chave
      JWT_SECRET: ${JWT_SECRET:-chave-de-estudo-com-pelo-menos-32-caracteres}
    restart: no
