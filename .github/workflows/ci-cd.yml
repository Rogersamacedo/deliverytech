name: Delivery API CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Chave só para os testes (mínimo de 32 caracteres)
      JWT_SECRET: chave-de-teste-ci-com-pelo-menos-32-caracteres

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar os testes
        run: mvn -B clean test

      - name: Guardar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco

      - name: Construir a imagem Docker
        run: docker build -t delivery-api .
